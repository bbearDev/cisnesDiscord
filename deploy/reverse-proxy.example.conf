# cisnesDiscord 리버스 프록시 예시 — 계획 §S0-5 · §5.4 · §11 D-7
#
# ★★ 공개해야 하는 경로는 **둘뿐이다.**
#
#     https://<HOST>/oauth/chzzk/<콜백경로>   →  127.0.0.1:8081/oauth/callback
#     https://<HOST>/websub/youtube/<채널ID>  →  127.0.0.1:8081/websub/<채널ID>
#
#   chzzkbot 웹훅(→ 8081)과 우리 폴링(→ 8080)은 **루프백**이라 프록시 대상이 아니다.
#   chzzkbot 과 cisnesDiscord 가 같은 호스트에서 돌기 때문이다 (rev.5 포트 배정 확정).
#
# ★ 왜 사람이 고르는가 (§11 D-7): nginx 와 caddy 는 **인증서 자동화 유무**에서 갈린다.
#   caddy 는 ACME 를 내장해 설정 한 줄이면 발급·갱신이 자동이고, nginx 는 certbot 을
#   따로 붙여야 한다. 경로가 2개뿐인 이 프로젝트에는 caddy 를 권고하지만,
#   운영자가 이미 nginx 를 쓰거나 그쪽에 익숙하면 그 선택이 낫다 —
#   **운영 주체가 유지보수할 것이므로 취향이 실제 비용을 정한다.**
#   계획은 어느 쪽도 강제하지 않는다. 두 예시를 모두 싣는 이유가 이것이다.
#
# ⚠️ TLS 는 애플리케이션이 종단하지 않는다. 앱은 평문 http 만 듣는다.
#
# ⚠️ 이 예시는 **프록시와 앱이 같은 호스트**인 설치를 상정한다 (그래서 `127.0.0.1:8081`).
#   프록시를 **다른 호스트**에 둔다면 `web.bindAddress` 를 루프백에서 열어야 하고
#   (`0.0.0.0` 또는 그 호스트의 LAN IP), 아래 `proxy_pass` 대상도 LAN 주소로 바꾼다.
#   그때는 8081 이 공인 IP 로 열리지 않도록 **방화벽이 격리를 맡는다** — 루프백 바인드가
#   하던 일을 대신할 것이 없으면 수신구가 그대로 노출된다.
#
# ⚠️ 콜백 경로가 **chzzkbot 의 기존 `CHZZK_REDIRECT_URI` 경로와 겹치면 안 된다** (S0-2).
#    콜백은 `code` 와 `state` 만 받으므로 **어느 앱의 코드인지 구분할 수 없다.**


# ══════════════════════════════════════════════════════════════════
#  (A) Caddy — 권고안. Caddyfile 에 넣는다.
# ══════════════════════════════════════════════════════════════════
#
# <HOST> {
#     # ── OAuth 콜백 ────────────────────────────────────────────────
#     # ★ 무인증 공개 표면이다. IP 기준 분당 60 요청으로 제한한다 (§5.6.2 FM4).
#     #   앱 안에서 세면 이미 이벤트 루프에 들어온 뒤라 FM1 의 연쇄를 못 막는다 —
#     #   잘라내는 지점은 루프 **바깥**이어야 한다.
#     @oauth path /oauth/chzzk/*
#     handle @oauth {
#         rate_limit {
#             zone oauth_cb {
#                 key    {remote_host}
#                 events 60
#                 window 1m
#             }
#         }
#         rewrite * /oauth/callback
#         reverse_proxy 127.0.0.1:8081
#     }
#
#     # ── WebSub 수신 ──────────────────────────────────────────────
#     # ★★ 여기에는 IP 리밋을 걸지 않는다 (또는 별도로 넉넉히).
#     #   허브 푸시는 pubsubhubbub.appspot.com 의 소수 IP 에 전부 몰린다.
#     #   60/분을 걸면 정상 푸시가 드롭될 수 있고 **그 드롭은 조용하다**
#     #   (허브 재시도 → RSS 가 뒤늦게 메움) — 누락은 안 나지만 AC-21(1분)만
#     #   조용히 깨진다. 채널 2~5개면 볼륨이 작아 리밋의 이득이 거의 없으므로
#     #   **본문 크기 상한과 HMAC 서명 검증에 맡긴다** (§5.6.2).
#     @websub path /websub/youtube/*
#     handle @websub {
#         request_body {
#             max_size 256KB
#         }
#         uri strip_prefix /websub/youtube
#         rewrite * /websub{uri}
#         reverse_proxy 127.0.0.1:8081
#     }
#
#     # 나머지는 열지 않는다. /healthz 도 공개하지 않는다 (루프백으로만 본다).
#     handle {
#         respond 404
#     }
# }
#
# ※ rate_limit 은 caddy 기본 빌드에 없다. xcaddy 로 caddy-ratelimit 을 넣거나,
#   그게 부담이면 이 지시자를 지우고 대신 fail2ban 등 호스트 레벨로 막는다.
#   **리밋이 없어도 기능은 동작한다** — state-먼저 검증(§S4) 덕에 외부인은
#   토큰 교환까지 도달하지 못한다. 리밋은 FM1 자원 고갈 방어이지 인증 방어가 아니다.


# ══════════════════════════════════════════════════════════════════
#  (B) nginx + certbot — 이미 nginx 를 쓰는 경우
# ══════════════════════════════════════════════════════════════════
#
# # ★ 리밋 존은 http {} 블록에 둔다 (server {} 안이 아니다).
# limit_req_zone $binary_remote_addr zone=oauth_cb:10m rate=60r/m;
#
# server {
#     listen 443 ssl http2;
#     server_name <HOST>;
#
#     ssl_certificate     /etc/letsencrypt/live/<HOST>/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/<HOST>/privkey.pem;
#
#     # ── OAuth 콜백 ────────────────────────────────────────────────
#     location /oauth/chzzk/ {
#         # burst 로 순간 몰림을 흡수하되 nodelay 로 지연 없이 통과시킨다.
#         limit_req zone=oauth_cb burst=20 nodelay;
#
#         proxy_pass http://127.0.0.1:8081/oauth/callback$is_args$args;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_read_timeout 15s;
#     }
#
#     # ── WebSub 수신 ──────────────────────────────────────────────
#     location /websub/youtube/ {
#         # ★ limit_req 를 걸지 않는다 — 위 (A) 의 이유와 같다.
#         client_max_body_size 256k;
#
#         proxy_pass http://127.0.0.1:8081/websub/;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         # ★ X-Hub-Signature 헤더가 앱까지 그대로 가야 한다. nginx 는 밑줄 없는
#         #   헤더를 기본 통과시키므로 별도 설정이 필요 없다 —
#         #   다만 underscores_in_headers 를 켜야 하는 다른 헤더와 헷갈리지 말 것.
#         proxy_read_timeout 15s;
#     }
#
#     location / { return 404; }
# }
#
# server {
#     listen 80;
#     server_name <HOST>;
#     # certbot 갱신용 경로만 열고 나머지는 리다이렉트한다.
#     location /.well-known/acme-challenge/ { root /var/www/certbot; }
#     location / { return 301 https://$host$request_uri; }
# }


# ══════════════════════════════════════════════════════════════════
#  배포 후 확인 (docs/runbook-ops.md 체크리스트와 같은 항목)
# ══════════════════════════════════════════════════════════════════
#
#   curl -sS -o /dev/null -w '%{http_code}\n' https://<HOST>/websub/youtube/<채널ID>
#       → 200 (hub.challenge 없는 GET 이므로 앱이 400 을 줄 수도 있다. 502·404 가
#         아니면 경로는 살아 있는 것이다)
#
#   ★ IP 리밋이 실제로 걸려 있는지 확인한다 — 설정이 저장소 밖이라
#     빠뜨려도 코드로는 잡히지 않는다 (§5.6.2 가 지목한 자리):
#       for i in $(seq 1 80); do curl -sS -o /dev/null -w '%{http_code} ' \
#         https://<HOST>/oauth/chzzk/callback; done; echo
#       → 60건 근처부터 429 가 섞여야 한다
